<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gigachad — widget demo</title>
    <style>
      body {
        margin: 0;
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 48px 24px;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.25rem;
      }
      p.lede {
        color: #64748b;
      }
      code,
      pre {
        font: 13px/1.5 ui-monospace, monospace;
      }
      pre {
        background: #0f172a;
        color: #e2e8f0;
        padding: 16px;
        border-radius: 8px;
        overflow-x: auto;
      }
      .card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 20px;
        margin: 16px 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This is not the dashboard.</h1>
      <p class="lede">
        It's an ordinary customer website — a different origin from the dashboard
        on purpose. Sign up at the dashboard, mint an embed token whose allowed
        origin is this page, then open
        <code>?key=wk_embed_…</code> so messages land in <em>your</em> inbox.
      </p>

    <script>
      (function () {
        var DEFAULT_KEY = 'wk_embed_b772ca50cf58e68efbb809af536fcf1f';
        var key = new URLSearchParams(location.search).get('key') || DEFAULT_KEY;
        var s = document.createElement('script');
        s.src = 'https://gigachad-app.devjs.in/widget/widget.js';
        s.async = true;
        s.setAttribute('data-widget-key', key);
        document.body.appendChild(s);
      })();
    </script>

  </body>
</html>
