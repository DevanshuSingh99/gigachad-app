# Production TLS overlay. Caddy binds 80/443 and issues on-demand certificates
# for verified custom knowledge-base hostnames (see Caddyfile).
#   COMPOSE_FILE=compose.yaml:compose.prod.yaml:compose.caddy.yaml
#   docker compose up -d --build

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api:
        condition: service_healthy
