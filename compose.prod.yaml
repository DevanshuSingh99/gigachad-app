# VM only. Pair with compose.caddy.yaml so Caddy owns 80/443:
#   COMPOSE_FILE=compose.yaml:compose.prod.yaml:compose.caddy.yaml
# Adds restart policies and the memory limits from documentation/12-deploy.md.
# Sized for 1 vCPU / 6 GB with 2 GB of swap.
#
# TLS and custom-domain HTTPS are Caddy (`compose.caddy.yaml` + `Caddyfile`):
# named hosts for gigachad-api.devjs.in / gigachad-kb.devjs.in, and on-demand
# certificates for VERIFIED knowledge-base hostnames via /internal/tls/ask.
# `api` still publishes to loopback for local debugging; public traffic goes
# through Caddy on the Compose network.

services:
  postgres:
    restart: unless-stopped
    command: postgres -c max_connections=25 -c shared_buffers=512MB
    deploy:
      resources:
        limits:
          memory: 1500M

  redis:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    restart: unless-stopped
    # Host :3000 is already used by invoice-gen-tool on this VM.
    ports:
      - "127.0.0.1:3060:3000"
    deploy:
      resources:
        limits:
          memory: 1024M

  worker:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
