# VM only, selected by COMPOSE_FILE in the VM's .env.
# Adds restart policies and the memory limits from docs/10-deployment.md.
# Sized for 1 vCPU / 6 GB with 2 GB of swap.
#
# No Caddy service here. This particular VM already runs a system-level nginx
# that owns ports 80/443 for other, unrelated projects (orders-and-settlements-*,
# rwa-*) — a second process cannot bind the same ports, and reconfiguring that
# nginx's TLS handling to make room for Caddy's on-demand-TLS model is out of
# scope for this deploy. Instead, `api` publishes to loopback only, and the
# existing nginx reverse-proxies gigachad-api.devjs.in / gigachad-kb.devjs.in to
# it directly — the same pattern nginx already uses for the other services
# running on this box. Trade-off accepted: Phase H's on-demand TLS for
# customer-added custom domains has no working path under this topology (it
# needs to terminate 443 itself for arbitrary hostnames); that feature is
# deferred rather than live on this deployment.

services:
  postgres:
    restart: unless-stopped
    command: postgres -c max_connections=25 -c shared_buffers=512MB
    deploy:
      resources:
        limits:
          memory: 1500M

  redis:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 1024M

  worker:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
